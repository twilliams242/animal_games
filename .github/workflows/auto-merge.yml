name: Auto-merge claude branches

on:
  push:
    branches:
      - 'claude/**'

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Don't run on the default branch itself
    if: github.ref != 'refs/heads/claude/echolocation-bat-simulation-bTGHl'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: claude/echolocation-bat-simulation-bTGHl

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge feature branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Merging $BRANCH into claude/echolocation-bat-simulation-bTGHl"
          git fetch origin "$BRANCH"
          git merge "origin/$BRANCH" --no-edit
          git push origin claude/echolocation-bat-simulation-bTGHl
